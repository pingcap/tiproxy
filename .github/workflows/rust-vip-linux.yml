name: Rust VIP Linux acceptance

on:
  pull_request:
    paths:
      - .github/workflows/rust-vip-linux.yml
      - rust/crates/control-config/**
      - rust/crates/tiproxy-rs/**
      - tests/dataplane/integration/vip-standalone.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-vip-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-node-vip:
    name: Two Linux standalone VIP owners
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATAPLANE_ARTIFACT_ROOT: ${{ github.workspace }}/tests/dataplane/integration/artifacts
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install checksum-pinned TiUP
        run: |
          source tests/dataplane/integration/versions.env
          archive="$RUNNER_TEMP/tiup-v${TIUP_VERSION}-linux-amd64.tar.gz"
          install_root="$RUNNER_TEMP/tiup-v${TIUP_VERSION}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/pingcap/tiup/releases/download/v${TIUP_VERSION}/tiup-v${TIUP_VERSION}-linux-amd64.tar.gz"
          echo "$TIUP_LINUX_AMD64_SHA256  $archive" | sha256sum -c -
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          "$install_root/bin/tiup" --version
          echo "$install_root/bin" >>"$GITHUB_PATH"
          echo "TIUP_HOME=$install_root" >>"$GITHUB_ENV"
      - name: Preinstall frozen TiUP components
        run: bash tests/dataplane/integration/warm-tiup-components.sh
      - name: Install Linux network and Rust build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 arping tcpdump protobuf-compiler
          command -v mysql
      - name: Build standalone Rust executable
        run: make rust-build
      - name: Prove VIP ownership and SQL continuity
        run: bash tests/dataplane/integration/vip-standalone.sh
      - name: Upload node and election evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-vip-linux-${{ github.run_id }}
          path: tests/dataplane/integration/artifacts/vip-*/diagnostics/**
          if-no-files-found: warn
          retention-days: 14
