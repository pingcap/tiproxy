name: Rust

on:
  pull_request:
    # `labeled` is not in the default set (opened/synchronize/reopened), so
    # without it, adding `ci-full` to an open pull request would change
    # nothing until the next push. The core jobs below skip label-only
    # events unless that label is `ci-full`, so an unrelated label is free.
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    paths:
      - ".github/workflows/rust.yml"
      - "AGENTS.md"
      - "Makefile"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "go.mod"
      - "pkg/controlbridge/**"
      - "pkg/balance/**"
      - "pkg/proxy/net/command.go"
      - "pkg/sqlreplay/cmd/**"
      - "lib/config/**"
      - "lib/go.mod"
      - "lib/go.sum"
      - "go.sum"
      - "proto/**"
      - "rust-toolchain.toml"
      - "rust/**"
      - "scripts/generate-control-proto.sh"
      - "tests/controlplane/**"
      - "tests/dataplane/capture-format/**"
      - "tests/replayer/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust.yml"
      - "AGENTS.md"
      - "Makefile"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "go.mod"
      - "pkg/controlbridge/**"
      - "pkg/balance/**"
      - "pkg/proxy/net/command.go"
      - "pkg/sqlreplay/cmd/**"
      - "lib/config/**"
      - "lib/go.mod"
      - "lib/go.sum"
      - "go.sum"
      - "proto/**"
      - "rust-toolchain.toml"
      - "rust/**"
      - "scripts/generate-control-proto.sh"
      - "tests/controlplane/**"
      - "tests/dataplane/capture-format/**"
      - "tests/replayer/**"
  # The control-plane evidence jobs below do not run on pull requests. They
  # re-prove live etcd / Go-oracle behaviour that a pull request rarely
  # changes, and re-running them on every push to a branch was the bulk of
  # the cost. They still run on every merge to main -- so a regression is
  # still bisectable to a single commit, not to a day -- plus nightly, on
  # demand, and on any pull request explicitly labelled `ci-full`.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests cancel their own superseded runs. Everything else -- pushes
  # to main, the nightly schedule, manual dispatch -- gets a group of its own,
  # so consecutive merges cannot cancel each other's evidence run. That is
  # what keeps a regression bisectable to a single commit; sharing
  # `github.ref` across every main push would silently defeat it.
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2

jobs:
  quality:
    name: Format, lint, and test
    if: github.event.action != 'labeled' || github.event.label.name == 'ci-full'
    runs-on: ubuntu-24.04
    # Formatting, Clippy, unit/doc tests, the generated-source check and the
    # Go control-bridge race test. The live-etcd and Go-oracle evidence steps
    # that used to sit here now live in `controlplane-evidence`, which does
    # not run on pull requests.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Verify generated control protocol sources and goldens
        run: make control-proto-generate-check
      - name: Run Go control bridge tests
        run: go test -race ./pkg/controlbridge/...
      - name: Verify Go native capture format golden
        run: go run ./tests/dataplane/capture-format | cmp - tests/dataplane/capture-format/native-v1.log
      - name: Check formatting and Clippy
        run: make rust-lint
      - name: Run unit tests
        run: make rust-test
      - name: Compare Go and Rust replay decoders and kill a mutation
        run: make replayer-differential-evidence
      - name: Run doc tests
        run: make rust-doc-test
      - name: Reject a stale lockfile
        run: cargo check --locked --workspace --manifest-path rust/Cargo.toml

  controlplane-evidence:
    name: Control-plane live and Go-oracle evidence
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-evidence-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run CP-002 live external dependency evidence
        run: make controlplane-cp002-evidence
      - name: Run CP-ETCD live lease and election evidence
        run: make controlplane-cp003-evidence
      - name: Run CP-ETCD retained authority and compiling mutation evidence
        run: make controlplane-cp003-authority-evidence
      - name: Run CP-CFG/NS differential and real-etcd evidence
        run: make controlplane-cp004-evidence
      - name: Run CP-ROUTE config and namespace projection evidence
        run: make controlplane-cproute-evidence
      - name: Run CP-METRICS query and history evidence
        run: make controlplane-cpmetrics-evidence
      - name: Check the native metrics exposition against the Go oracle
        run: make dataplane-metrics-parity
      - name: Check log rotation retention against the Go lumberjack writer
        run: make controlplane-cplog-evidence
      - name: Check the admin API and config checksum against the Go server
        run: make controlplane-cpadmin-evidence
      - name: Check the diagnostics gRPC service against the Go server
        run: make controlplane-cpdiag-evidence
      - name: Check tiproxyctl against the Go and Rust management planes
        run: make controlplane-cpctl-evidence
      - name: Run CP-METER durable ingestion and state handoff evidence
        run: make controlplane-cpmeter-evidence

  applied-metrics:
    name: Applied metrics material and transport evidence
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-24.04
    # Keep the existing CP-ROUTE/CP-METRICS gates intact and give the new
    # isolated real-etcd mutation build its own bounded execution budget.
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-metric-applied-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run applied metrics live and compiling mutation evidence
        run: make controlplane-cpmetrics-applied-evidence

  collector-metrics:
    name: Metrics collector and mixed owner evidence
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-24.04
    # Run the complete collector evidence independently of the older quality job.
    # Each compiling mutant gets owned real etcd and an actual Go reader peer.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-metric-collector-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run collector live and compiling mutation evidence
        run: make controlplane-cpmetrics-collector-evidence

  factor-metrics:
    name: Resource factor and producer evidence
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-24.04
    # Actual Go factors, real collector/ledger composition and compiling mutations.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-metric-factors-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run factor observations, real producer and compiling mutations
        run: make controlplane-cpmetrics-factor-evidence

  resource-routing:
    name: Composed Resource and Location routing
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-24.04
    # Actual Go Group.Route, policy/query lifetimes, source windows and reservations.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-resource-routing-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run composed reservations and compiling mutations
        run: make controlplane-cproute-resource-evidence

  migration-ledger:
    name: Migration ledger, factor pairs and physical order
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-24.04
    # Actual Go Group.Balance lifecycle, final admission lock and exact terminals.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-migration-ledger-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run shared migration lifecycle and compiling mutations
        run: make controlplane-cproute-migration-evidence
      - name: Compare actual factor pairs and physical arrival order
        run: make controlplane-cproute-balance-evidence

  migration-worker:
    name: Migration worker timing, closure and ownership
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-24.04
    # Separate budget: shared Go clocks, real producer retirement and compiling faults.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-migration-worker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Compare worker clocks, source lifecycle and compiling mutations
        run: make controlplane-cproute-worker-evidence

  routing-api:
    name: Router API differential adapter smoke
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-routing-api-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Check recorder lifecycle and external input regressions
        env:
          CPROUTE_RECORDED_SOURCE_ERRORS: ${{ runner.temp }}/routing-api-recorded-source
          CPROUTE_RECORDED_METRICS: ${{ runner.temp }}/routing-api-recorded-metrics
        run: |
          go test -race -tags apireplay ./tests/controlplane/cproute/api-differential/recorder/... -count=1 -timeout=120s
          recorder_source_link="${RUNNER_TEMP}/tiproxy-api-recorder-source"
          ln -s "${GITHUB_WORKSPACE}" "${recorder_source_link}"
          PWD="${recorder_source_link}" python3 "${recorder_source_link}/tests/controlplane/cproute/api-differential/recorder/record.py" build \
            --out "${RUNNER_TEMP}/tiproxy-api-recorder-build"
          python3 - <<'PYTEST'
          import importlib.util
          import json
          import os
          from pathlib import Path
          path = Path("tests/controlplane/cproute/api-differential/recorder/derive_expectations.py")
          spec = importlib.util.spec_from_file_location("derive", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          results = module.defect_checks()
          print(json.dumps(results, indent=2))
          assert all("NOT CAUGHT" not in result for result in results.values())
          capture = Path(os.environ["CPROUTE_RECORDED_SOURCE_ERRORS"])
          trace = json.loads((capture / "trace.json").read_text())
          rows = json.loads((capture / "go.json").read_text())
          derived, requires = module.derive(trace, rows, None)
          assert trace["provenance"]["kind"] == "synthetic" and not requires
          module._RUNNER.validate(derived)
          module._RUNNER.observe(derived, rows, "recorded-go")
          (capture / "derived.json").write_text(json.dumps(derived, indent=2) + "\n")
          (capture / "stored-validation.json").write_text(json.dumps({"status":"passed", "events":len(rows), "requires":requires}) + "\n")
          capture = Path(os.environ["CPROUTE_RECORDED_METRICS"])
          trace = json.loads((capture / "trace.json").read_text())
          rows = json.loads((capture / "go.json").read_text())
          manifest = json.loads((capture / "manifest.json").read_text())
          assert manifest["qualification"] == "pending-derivation"
          assert manifest["qualified"] is False and "requires" not in manifest
          derived, requires = module.derive(trace, rows, None)
          assert trace["provenance"]["kind"] == "synthetic" and not requires
          module._RUNNER.validate(derived)
          module._RUNNER.observe(derived, rows, "recorded-go")
          (capture / "derived.json").write_text(json.dumps(derived, indent=2) + "\n")
          (capture / "stored-validation.json").write_text(json.dumps({"status":"passed", "events":len(rows), "requires":requires, "paired":"pending", "qualification":"synthetic"}) + "\n")
          PYTEST
          python3 tests/controlplane/cproute/api-differential/test_run.py
          python3 tests/controlplane/cproute/api-differential/recorder/test_cidr.py
          python3 tests/controlplane/cproute/api-differential/recorder/test_effects.py
          python3 tests/controlplane/cproute/api-differential/recorder/test_cadence.py
          python3 tests/controlplane/cproute/api-differential/recorder/test_status_cadence.py
          python3 tests/controlplane/cproute/api-differential/recorder/test_resource_metrics.py
          python3 tests/controlplane/cproute/api-differential/recorder/test_resource_cadence.py
          python3 tests/controlplane/cproute/api-differential/recorder/scripts/test_validate_normal.py
          python3 tests/controlplane/cproute/api-differential/recorder/scripts/test_validate_failover.py
          python3 tests/controlplane/cproute/api-differential/recorder/scripts/test_validate_config.py
          python3 tests/controlplane/cproute/api-differential/recorder/scripts/gen_config_scripts.py --check
      - name: Compare the actual API adapters
        run: |
          python3 tests/controlplane/cproute/api-differential/run.py \
            tests/controlplane/cproute/api-differential/smoke.json \
            --output "${RUNNER_TEMP}/routing-api" --comparator-check
          python3 tests/controlplane/cproute/api-differential/run.py \
            tests/controlplane/cproute/api-differential/port-smoke.json \
            --output "${RUNNER_TEMP}/routing-api-port"
          python3 tests/controlplane/cproute/api-differential/run.py \
            tests/controlplane/cproute/api-differential/source-error-smoke.json \
            --output "${RUNNER_TEMP}/routing-api-source-error"
          python3 tests/controlplane/cproute/api-differential/run.py \
            tests/controlplane/cproute/api-differential/retry-smoke.json \
            --output "${RUNNER_TEMP}/routing-api-retry"
          python3 tests/controlplane/cproute/api-differential/run.py \
            tests/controlplane/cproute/api-differential/metrics-time-smoke.json \
            --output "${RUNNER_TEMP}/routing-api-metrics-time"
          python3 - <<'PYRESOURCE'
          import importlib.util
          import json
          import os
          from pathlib import Path
          path = Path("tests/controlplane/cproute/api-differential/recorder/derive_expectations.py")
          spec = importlib.util.spec_from_file_location("derive", path)
          derive = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(derive)
          source = path.parents[1] / "metrics-time-smoke.json"
          trace = json.loads(source.read_text())
          output = Path(os.environ["RUNNER_TEMP"]) / "routing-api-metrics-time"
          derivations = []
          for engine in ("go", "rust"):
              rows = json.loads((output / f"{engine}.json").read_text())
              derived, requires = derive.derive(trace, rows, None, engine=engine)
              assert not requires, (engine, requires)
              assert derive.compare_with_reference(derived, trace, requires) == ([], [])
              derive._RUNNER.validate(derived)
              derive._RUNNER.observe(derived, rows, engine)
              derivations.append(derived)
          assert derivations[0] == derivations[1]
          result = derive._RUNNER.compare(derivations[0],
              json.loads((output / "go.json").read_text()),
              json.loads((output / "rust.json").read_text()))
          assert result["events"] == 170 and result["violations"] == 0
          (output / "derived.json").write_text(json.dumps(derivations[0], indent=2) + "\n")
          (output / "derived-validation.json").write_text(json.dumps(result, indent=2) + "\n")
          (output / "input-scenario-validation.json").write_text(json.dumps({
              "status":"passed", "events":170, "publications":24, "choices":32,
              "requires":[], "independent_derivations_equal":True,
              "qualification":"synthetic: not a qualifying recording"}) + "\n")
          print("RESOURCE-METRICS-DERIVED", result)
          PYRESOURCE
          for rule in client proxy; do
            python3 tests/controlplane/cproute/api-differential/run.py \
