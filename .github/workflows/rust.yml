              derived, requires = derive.derive(trace, go, None)
              other, other_requires = derive.derive(trace, rust, None, engine="rust")
              assert not requires and not other_requires, (requires, other_requires)
              assert derived == other
              assert derive.compare_with_reference(derived, trace, requires) == ([], [])
              result = derive._RUNNER.compare(derived, go, rust)
              (output / "derived.json").write_text(json.dumps(derived, indent=2) + "\n")
              (output / "derived-validation.json").write_text(json.dumps(result, indent=2) + "\n")
              print("CIDR-DERIVED", rule, result)
          PYCIDR
          python3 tests/controlplane/cproute/api-differential/run.py \
            tests/controlplane/cproute/api-differential/force-close-smoke.json \
            --output "${RUNNER_TEMP}/routing-api-force-close"
          python3 tests/controlplane/cproute/api-differential/recorder/keyspace_smoke.py \
            "${RUNNER_TEMP}/keyspace-smoke.json"
          python3 tests/controlplane/cproute/api-differential/run.py \
