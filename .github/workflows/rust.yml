                   (Path(os.environ["RUNNER_TEMP"]) / "router-reset-smoke.json", "routing-api-router-reset")]
          for source, folder in cases:
              trace = json.loads(source.read_text())
              output = Path(os.environ["RUNNER_TEMP"]) / folder
              go = json.loads((output / "go.json").read_text())
              rust = json.loads((output / "rust.json").read_text())
              derived, requires = derive.derive(trace, go, None)
              other, other_requires = derive.derive(trace, rust, None, engine="rust")
              assert not requires and not other_requires, (requires, other_requires)
              assert derived == other
              assert derive.compare_with_reference(derived, trace, requires) == ([], [])
