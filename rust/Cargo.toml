[workspace]
members = [
    "crates/control-admin",
    "crates/control-config",
    "crates/control-etcd",
    "crates/control-external",
    "crates/control-plane",
    "crates/control-meter",
    "crates/control-proto",
    "crates/control-router",
    "crates/control-routing",
    "crates/control-topology",
    "crates/dataplane",
    "crates/differential-runner",
    "crates/legacy-router-shadow",
    "crates/mysql-wire",
    "crates/proxy-io",
    "crates/replayer-core",
    "crates/session-core",
    "crates/tiproxy-replayer",
    "crates/tiproxy-rs",
]
exclude = ["ci/fixtures"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "Apache-2.0"
repository = "https://github.com/pingcap/tiproxy"

[workspace.dependencies]
aes = { version = "=0.8.4", default-features = false }
axum = { version = "=0.8.9", default-features = false }
hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1", "http2"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["server", "server-auto", "server-graceful", "service", "tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
openssl = { version = "=0.10.81", default-features = false, features = ["vendored"] }
azure_core = { version = "=0.29.1", default-features = false }
azure_identity = { version = "=0.29.0", default-features = false, features = ["tokio", "client_certificate"] }
async-trait = { version = "=0.1.89", default-features = false }
rustls-native-certs = { version = "=0.8.2", default-features = false }
rust-ini = { version = "=0.21.3", default-features = false }
bytes = { version = "=1.12.1", default-features = false }
reqsign-core = { version = "=3.3.1", default-features = false }
quick-xml = { version = "=0.41.0", default-features = false, features = ["serialize"] }
reqsign-aws-core = { version = "=3.1.1", default-features = false }
reqsign-aws-v4 = { version = "=3.3.0", default-features = false }
reqsign-aliyun-oss = { version = "=3.1.5", default-features = false }
reqsign-tencent-cos = { version = "=3.0.6", default-features = false }
clap = { version = "=4.5.51", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
crc32fast = { version = "=1.5.1", default-features = false }
ctr = { version = "=0.9.2", default-features = false }
getrandom = "=0.2.17"
control-admin = { path = "crates/control-admin", version = "0.1.0" }
control-config = { path = "crates/control-config", version = "0.1.0" }
control-external = { path = "crates/control-external", version = "0.1.0" }
control-etcd = { path = "crates/control-etcd", version = "0.1.0" }
control-plane = { path = "crates/control-plane", version = "0.1.0" }
control-meter = { path = "crates/control-meter", version = "0.1.0" }
control-proto = { path = "crates/control-proto", version = "0.1.0" }
control-router = { path = "crates/control-router", version = "0.1.0" }
control-routing = { path = "crates/control-routing", version = "0.1.0" }
control-topology = { path = "crates/control-topology", version = "0.1.0" }
criterion = { version = "=0.8.2", default-features = false }
dataplane = { path = "crates/dataplane", version = "0.1.0" }
displaydoc = { version = "=0.2.5", default-features = false }
etcd-client = { version = "=0.20.0", default-features = false, features = ["tls-ring"] }
flate2 = { version = "=1.1.2", default-features = false, features = ["rust_backend"] }
futures-util = { version = "=0.3.31", default-features = false, features = ["std"] }
http = { version = "=1.3.1", default-features = false }
if-addrs = { version = "=0.13.4", default-features = false }
libc = { version = "=0.2.189", default-features = false }
legacy-router-shadow = { path = "crates/legacy-router-shadow", version = "0.1.0" }
mysql-wire = { path = "crates/mysql-wire", version = "0.1.0" }
opendal = { version = "=0.53.3", default-features = false, features = ["executors-tokio", "services-azblob", "services-cos", "services-fs", "services-gcs", "services-oss", "services-s3"] }
proxy-io = { path = "crates/proxy-io", version = "0.1.0" }
replayer-core = { path = "crates/replayer-core", version = "0.1.0" }
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
session-core = { path = "crates/session-core", version = "0.1.0" }
prost = { version = "=0.14.1", default-features = false, features = ["derive", "std"] }
rcgen = { version = "=0.14.9", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls-manual-roots", "stream"] }
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode", "perf"] }
rustix = { version = "=0.38.44", default-features = false, features = ["fs", "std"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.14.1", default-features = false, features = ["alloc", "std"] }
socket2 = { version = "=0.6.1", default-features = false, features = ["all"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "=1.47.1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
thiserror = { version = "=2.0.17", default-features = false }
time = { version = "=0.3.55", default-features = false, features = ["formatting", "parsing", "serde", "std"] }
toml = { version = "=0.8.23", default-features = false, features = ["display", "parse"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "server", "transport"] }
tonic-prost = { version = "=0.14.6", default-features = false }
x509-parser = { version = "=0.18.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
url = { version = "=2.5.7", default-features = false }
zstd-pure-rs = { version = "=0.1.2", default-features = false, features = ["std"] }
zstd-zero = { version = "=0.1.0", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.metadata.tiproxy]
default-feature-policy = "Default features stay empty; deployment-specific behavior requires an explicit, additive feature."
protocol-policy = "MySQL packet payloads stay inside the Rust dataplane and never cross control IPC or FFI."

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
