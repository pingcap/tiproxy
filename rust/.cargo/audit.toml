[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
informational_warnings = ["unmaintained", "unsound"]
severity_threshold = "low"

[database]
url = "https://github.com/RustSec/advisory-db.git"
fetch = true
stale = false

[output]
deny = ["warnings"]
quiet = false
show_tree = true

[target]
arch = ["x86_64", "aarch64"]
os = ["linux"]

[yanked]
enabled = true
update_index = true
