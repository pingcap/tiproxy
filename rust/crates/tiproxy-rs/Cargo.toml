[package]
name = "tiproxy-rs"
description = "TiProxy Rust dataplane executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
default = []

[dependencies]
control-admin.workspace = true
control-config.workspace = true
control-etcd.workspace = true
control-external.workspace = true
control-plane.workspace = true
control-meter.workspace = true
control-proto.workspace = true
control-router.workspace = true
control-topology.workspace = true
dataplane.workspace = true
session-core.workspace = true
legacy-router-shadow.workspace = true
if-addrs.workspace = true
libc.workspace = true
rustix.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["process", "signal"] }
tokio-rustls.workspace = true

[dev-dependencies]
# The etcd v3 KV service fixture is hand-rolled from a single-route tonic
# adapter + hand-defined wire-compatible prost messages, so it needs no
# `etcd-client` `build-server` feature (which would pull a second `syn` major).
hyper = { version = "=1.11.1", default-features = false, features = ["http2", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["service", "tokio"] }
prost.workspace = true
rcgen.workspace = true
rustls-pki-types.workspace = true
# `test-util` (paused clock + `tokio::time::advance`) drives the routing-refresh
# loop's generation-semantics rows deterministically. It is a feature flag on the
# already-resolved `tokio` crate (dataplane already enables it), so it adds no new
# package to Cargo.lock.
tokio = { workspace = true, features = ["test-util"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[lints]
workspace = true
